<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vereinswelt · Aufbauvorschau</title>
<style>body{font:16px system-ui;background:#111b22;color:#edf1ee;margin:0}main{max-width:920px;margin:auto;padding:24px}h1{font-size:25px}p{line-height:1.6;color:#bdc8c8}label{display:block;margin:18px 0 6px}select,input,button{font:inherit;background:#203039;color:inherit;border:1px solid #4c6168;border-radius:8px;padding:12px;max-width:100%;box-sizing:border-box}select,input{width:100%}button{cursor:pointer;margin:16px 8px 0 0}button:disabled{opacity:.45;cursor:default}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:#203039;border-radius:12px;padding:18px}.palette{display:flex;gap:8px}.swatch{height:24px;width:24px;border:1px solid #94a5a6;border-radius:50%}#clubs{margin-top:24px}#engine{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}#status{min-height:30px}.band{display:inline-block;width:14px;height:14px;border-radius:50%;margin-left:6px}.band-0{background:#847482}.band-1{background:#9d6657}.band-2{background:#e1b05a}.band-3{background:#93c478}.band-4{background:#67beaf}</style>
<main><h1>Erweiterte Vereinswelt · Saison 1</h1><p>Zwölf Länder und 192 Vereine mit Crown und Horizon Cup. Die Karriere ist lokal mit Länderwertung, Folgequalifikation und Saisonwechsel spielbar. Eine Welt wird erst über „Speichern“ dauerhaft abgelegt.</p>
<div class="grid"><div><label for="country">Land</label><select id="country" disabled></select></div><div><label for="club">Startverein</label><select id="club" disabled></select></div><div><label for="name">Managername</label><input id="name" value="Manager" maxlength="32"></div><div><label for="seed">Weltkennung</label><input id="seed" value="expansion-preview-1"></div></div>
<button id="create" disabled>Welt vorbereiten</button><button id="store" disabled>Speichern</button><button id="play" disabled>Gespeicherte Karriere öffnen</button><button id="download" disabled>Als Datei herunterladen</button><p id="status" role="status">Spielgrundlage wird geladen …</p><div id="summary"></div><div id="clubs" class="grid"></div>
<iframe id="engine" title="Spielgrundlage" src="index.html" aria-hidden="true" tabindex="-1"></iframe></main>
<script>
let api,world,engine;const el=id=>document.getElementById(id),esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function choices(){el('club').innerHTML=api.catalog().filter(c=>c.playable&&c.countryId===el('country').value).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');}
el('engine').onload=()=>{engine=el('engine').contentWindow;api=engine.D6Expansion;if(!api){el('status').textContent='Die Spielgrundlage konnte nicht geladen werden.';return;}el('country').innerHTML=api.countries().map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');el('country').value='AUT';choices();el('club').value='AUT-5';el('country').disabled=el('club').disabled=el('create').disabled=false;el('status').textContent='Bereit. Wähle deinen Verein.';};
el('country').onchange=choices;
el('create').onclick=async()=>{el('create').disabled=true;el('play').disabled=true;el('store').disabled=el('download').disabled=true;el('status').textContent='Die Vereinswelt wird vorbereitet …';await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));try{world=api.createCareer(el('club').value,el('seed').value,el('name').value);el('status').textContent='Die Welt ist vorbereitet und noch nicht gespeichert.';el('summary').textContent=`${world.world.countries.length} Länder · ${world.world.clubs.length} Vereine · ${world.world.clubs.reduce((n,c)=>n+c.roster.length,0)} Profis · ${world.world.contracts.length} Verträge`;el('summary').textContent+=' | 26 Wettbewerbe | Saisonwechsel und Länderwertung spielbar';el('summary').insertAdjacentHTML('beforeend',api.calendarHTML(world)+api.crownHTML(world));el('clubs').innerHTML=world.world.clubs.filter(c=>c.countryId===el('country').value).map(c=>`<article class="card">${api.crest(c)}<h2>${esc(c.name)}</h2><p>${esc(c.city)} · ${c.leagueId?'Ligaverein':'Pokalverein'}</p><div class="palette">${Object.values(c.kits.colors).map(color=>`<span class="swatch" style="background:${color}" aria-label="Vereinsfarbe ${color}"></span>`).join('')}</div><p>${c.roster.length} Profis · ${c.youthPool.length} Jugendspieler</p><p>${esc(c.historyText)}</p></article>`).join('');el('store').disabled=el('download').disabled=false;}catch(error){world=null;el('status').textContent=error.message;}finally{el('create').disabled=false;}};
el('store').onclick=async()=>{el('store').disabled=true;try{const saved=await api.store(world);world=saved;el('play').disabled=false;el('status').textContent='Gespeichert. Die Welt ist in der Spielstandliste der Spielgrundlage verfügbar.';}catch(error){el('status').textContent=error.message;el('store').disabled=false;}};
el('play').onclick=()=>{location.href='index.html';};
el('download').onclick=()=>{const blob=new Blob([JSON.stringify({game:'Doppel 6',format:'world',schema:world.schema,modelVersion:world.modelVersion,exported:new Date().toISOString(),save:world})],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='doppel6-expansion-saison1.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></html>
