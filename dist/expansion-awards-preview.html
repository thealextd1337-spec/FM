<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doppel 6 · Award-Entwürfe</title><style>body{font:16px system-ui;margin:0;padding:24px;background:#101f24;color:#eff6ee}main{max-width:1200px;margin:auto}h1{font-size:28px}p{max-width:70ch;line-height:1.6}section{margin:32px 0;border-top:1px solid #56747b;padding-top:16px}.awards{display:flex;flex-wrap:wrap;gap:18px}.award{width:190px}.sample{background:#10262d;padding:12px;display:flex;align-items:center;justify-content:center;gap:12px}.sample.light{background:#f1efe4}.sample img{width:96px;height:96px}.sample img.small{width:24px;height:24px}#engine{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}</style><main><h1>Trophäen und Medaillen</h1><p>Freigegebene detaillierte Motive: zwölf Landes-Sets, Crown Cup und Horizon Cup. Je ein großes und ein kompaktes transparentes Motiv auf hellem und dunklem Grund. Alle zwölf Landes-Sets sind im gleichen detaillierten Stil gestaltet.</p><div id="awards"></div></main><iframe id="engine" src="index.html" title="Awardgrundlage" aria-hidden="true"></iframe><script>document.querySelector('#engine').onload=async()=>{const m=await(await fetch('trophies-expansion/manifest.json')).json(),out=document.querySelector('#awards'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));for(const country of [...new Set(m.entries.map(e=>e.country))]){const entries=m.entries.filter(e=>e.country===country);out.insertAdjacentHTML('beforeend',`<section><h2>${esc(country)}</h2><div class="awards">${entries.map(e=>`<article class="award"><h3>${esc(e.label)}</h3>${['dark','light'].map(theme=>`<div class="sample ${theme}"><img src="${e.variants.large}" alt="${esc(e.label)}"><img class="small" src="${e.variants.small}" alt="${esc(e.label)} kompakt"></div>`).join('')}</article>`).join('')}</div></section>`);}}</script></html>
