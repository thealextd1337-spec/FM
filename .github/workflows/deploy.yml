name: Doppel 6 deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doppel-6-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fussball.cakamper.at/
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Spieltests ausführen
        run: |
          node work/test-progress-v58.cjs
          node work/test-live-player-v59.cjs
          node work/test-progress-menu.cjs
          node work/test-transfer-confirmations.cjs
          node work/test-transfer-deadline-dialog.cjs
          node work/test-tactics-replacement.cjs
          node work/test-quick-lineup-cells.cjs
          node work/test-v24.cjs
          node work/test-mobile-drag-scroll.cjs
          node work/test-v20-wake-lifecycle.cjs
          node work/test-v31.cjs
          node work/test-v41.cjs
          node work/test-v42.cjs
          node work/test-v44.cjs
          node work/test-v45.cjs
          node work/test-v47.cjs
          node work/test-statistics-menu.cjs
          node work/test-player-seasons.cjs
          node work/test-v49.cjs
          node work/test-v50.cjs
          node work/test-v50-balance.cjs
          node work/test-v51.cjs
          node work/test-v52.cjs
          node work/test-v53.cjs
          node work/test-v54.cjs
          node work/test-v55.cjs
          node work/test-ai-season-stats.cjs
          node work/test-ai-career-v60.cjs
          node work/test-breakaway.cjs
          node work/test-v56.cjs
          node work/test-duel-streaks.cjs
          node work/test-v57.cjs
          node work/test-world-foundation-v61.cjs
          node work/test-world-local-start.cjs
          node work/test-world-competition-v62.cjs
          node work/test-world-coaches-v63.cjs
          node work/test-world-match-v64.cjs
          node work/test-world-penalties-v65.cjs
          node work/test-world-victory-popup.cjs
          node work/test-world-nationalities-v79.cjs
          node work/test-world-market-nationalities-v79.cjs
          node work/test-world-kits-v81.cjs
          node work/test-world-direct-transfer.cjs
          node work/test-world-navigation.cjs
          node work/test-world-swap-banner.cjs
          node work/test-world-goal-scene-v83.cjs
          node work/test-world-goal-banner-v84.cjs
          node work/test-i18n-v75.cjs
          node work/test-world-live-ranks.cjs
          node work/test-world-grid-v71.cjs
          node work/test-world-player-instructions.cjs
          node work/test-world-physical-instructions.cjs
          node work/test-world-career-plan.cjs
          node work/test-world-economy-v66.cjs
          node work/test-world-sponsors-v97.cjs
          node work/test-world-career-events.cjs
          node work/test-world-playable-rosters.cjs
          node work/test-world-transfer-list-v72.cjs
          node work/test-world-human-sale-v73.cjs
          node work/test-world-youth-manager-v67.cjs
          node work/test-finance-close-v130.cjs
          node work/test-world-payments-v124.cjs
          node work/test-3d-documentation-v134.cjs
          node work/test-mobile-performance-v135.cjs
          node work/test-world-storage-v67.cjs
          node work/test-world-storage-recovery.cjs
          node work/test-world-save-management-v70.cjs
          node work/test-world-views-v68.cjs
          node work/test-world-honours-v74.cjs
          node work/test-match-presentation-v74.cjs
          node work/test-player-ui-projection.cjs
          node work/test-player-aging.cjs
          node work/test-player-load-candidate-v158.cjs
          node work/test-native-career-v160.cjs
          node work/platform/qa/test-unity-integration-v160.cjs
          node work/platform/qa/test-world-unity-contract.cjs
          node work/test-unity-label-layout.cjs
          node work/platform/qa/test-world-unity-slides.cjs
          DOPPEL_SEASONS=10 node work/test-world-economy-v66.cjs
          DOPPEL_SALES=1 DOPPEL_SEASONS=10 node work/test-world-economy-v66.cjs
          DOPPEL_SEASONS=10 node work/test-world-youth-manager-v67.cjs
          node work/audit-world-balance-v68.cjs
          python3 work/test_deploy_ftps.py
          python3 work/test_deploy_unity_assets.py

      - name: Einzeldatei bauen
        run: |
          node work/build.cjs
          node work/test-club-crests.cjs
          node work/test-no-player-images.cjs

      - name: Unity-Laufzeit vor der neuen Spielseite hochladen und prüfen
        env:
          W4Y_FTP_HOST: ${{ secrets.W4Y_FTP_HOST }}
          W4Y_FTP_USER: ${{ secrets.W4Y_FTP_USER }}
          W4Y_FTP_PASSWORD: ${{ secrets.W4Y_FTP_PASSWORD }}
          W4Y_FTP_REMOTE_DIR: ${{ secrets.W4Y_FTP_REMOTE_DIR }}
        run: python3 work/deploy_unity_assets.py

      - name: Per FTPS zu World4You hochladen und Live-Datei prüfen
        env:
          W4Y_FTP_HOST: ${{ secrets.W4Y_FTP_HOST }}
          W4Y_FTP_USER: ${{ secrets.W4Y_FTP_USER }}
          W4Y_FTP_PASSWORD: ${{ secrets.W4Y_FTP_PASSWORD }}
          W4Y_FTP_REMOTE_DIR: ${{ secrets.W4Y_FTP_REMOTE_DIR }}
          DEPLOY_SHA: ${{ github.sha }}
        run: python3 work/deploy_ftps.py
