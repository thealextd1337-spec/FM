name: Doppel 6 deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doppel-6-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fussball.cakamper.at/
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Spieltests ausführen
        run: |
          node work/test-progress-v58.cjs
          node work/test-live-player-v59.cjs
          node work/test-progress-menu.cjs
          node work/test-transfer-confirmations.cjs
          node work/test-transfer-deadline-dialog.cjs
          node work/test-tactics-replacement.cjs
          node work/test-quick-lineup-cells.cjs
          node work/test-v24.cjs
          node work/test-mobile-drag-scroll.cjs
          node work/test-v31.cjs
          node work/test-v41.cjs
          node work/test-v42.cjs
          node work/test-v44.cjs
          node work/test-v45.cjs
          node work/test-v47.cjs
          node work/test-statistics-menu.cjs
          node work/test-player-seasons.cjs
          node work/test-v49.cjs
          node work/test-v50.cjs
          node work/test-v50-balance.cjs
          node work/test-v51.cjs
          node work/test-v52.cjs
          node work/test-v53.cjs
          node work/test-v54.cjs
          node work/test-v55.cjs
          node work/test-ai-season-stats.cjs
          node work/test-ai-career-v60.cjs
          node work/test-breakaway.cjs
          node work/test-v56.cjs
          node work/test-duel-streaks.cjs
          node work/test-v57.cjs
          node work/test-world-foundation-v61.cjs
          node work/test-world-competition-v62.cjs
          node work/test-world-coaches-v63.cjs
          node work/test-world-match-v64.cjs
          node work/test-world-grid-v71.cjs
          node work/test-world-economy-v66.cjs
          node work/test-world-youth-manager-v67.cjs
          node work/test-world-storage-v67.cjs
          node work/test-world-save-management-v70.cjs
          node work/test-world-views-v68.cjs
          DOPPEL_SEASONS=10 node work/test-world-economy-v66.cjs
          DOPPEL_SEASONS=10 node work/test-world-youth-manager-v67.cjs
          node work/audit-world-balance-v68.cjs
          python3 work/test_deploy_ftps.py

      - name: Einzeldatei bauen
        run: node work/build.cjs

      - name: Per FTPS zu World4You hochladen und Live-Datei prüfen
        env:
          W4Y_FTP_HOST: ${{ secrets.W4Y_FTP_HOST }}
          W4Y_FTP_USER: ${{ secrets.W4Y_FTP_USER }}
          W4Y_FTP_PASSWORD: ${{ secrets.W4Y_FTP_PASSWORD }}
          W4Y_FTP_REMOTE_DIR: ${{ secrets.W4Y_FTP_REMOTE_DIR }}
          DEPLOY_SHA: ${{ github.sha }}
        run: python3 work/deploy_ftps.py
