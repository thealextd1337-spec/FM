<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doppel 6 · Vergleichsergebnis</title><link rel="stylesheet" href="/demo/style.css"><style>table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--accent)}.summary{max-width:900px}.evidence a{display:block;padding:8px 0}#comparison{overflow:auto}#findings{max-height:none;overflow:visible;margin-bottom:24px}</style></head><body><header><span class="eyebrow">DOPPEL 6 · WELLE 0 + 1</span><h1>Vergleich und Nachweise.</h1><p>Lokale Messungen und nachvollziehbare Grenzen.</p></header><main><p><a href="/">← Zur Vergleichsdemo</a></p><section class="summary"><p id="status">Die Schlussprüfung wird vorbereitet.</p><div id="comparison"></div><h2>Befunde</h2><ul id="findings"></ul><h2>Prüfbelege</h2><div class="evidence" id="evidence"></div></section></main><script>
fetch('/results/final-report.json').then(r=>{if(!r.ok)throw Error('Der abschließende Vergleichsbericht wird noch erstellt.');return r.json();}).then(r=>{document.getElementById('status').textContent='Archivierter Vergleich vor der Ergänzung von Nachlauf und Tornetzen. Die damaligen Leistungsmessungen gelten für diesen früheren Stand. '+r.summary;const table=document.createElement('table'),head=document.createElement('tr');for(const text of ['Merkmal','Browserengine','Unity']){const th=document.createElement('th');th.textContent=text;head.append(th);}table.append(head);for(const row of r.comparison||[]){const tr=document.createElement('tr');for(const text of [row.label,row.browser,row.unity]){const td=document.createElement('td');td.textContent=text;tr.append(td);}table.append(tr);}document.getElementById('comparison').append(table);for(const text of r.findings||[]){const li=document.createElement('li');li.textContent=text;document.getElementById('findings').append(li);}for(const e of r.evidence||[]){const a=document.createElement('a');a.href='/results/'+e.path;a.textContent=e.label;document.getElementById('evidence').append(a);}}).catch(e=>{document.getElementById('status').textContent=e.message;});
</script></body></html>
